<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Starbucks | Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<div class="container nav-container">
<div class="logo">
<img src="https://upload.wikimedia.org/wikipedia/sco/thumb/d/d3/Starbucks_Corporation_Logo_2011.svg/800px-Starbucks_Corporation_Logo_2011.svg.png" alt="Starbucks logo">
<span>Starbucks</span>
</div>
<nav>
<button class="nav-toggle">
<span></span>
<span></span>
<span></span>
</button>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="menu.html">Menu</a></li>
<li><a href="rewards.html">Rewards</a></li>
<li><a href="giftcards.html">Gift Cards</a></li>
<li><a href="stores.html">Stores</a></li>
<li class="nav-btn-group">
</li>
</ul>
</nav>
</div>
</header>
<main class="auth-page">
<div class="auth-card">
<h1>Sign in</h1>
<p class="auth-subtitle">Sign in to your Starbucks Rewards account.</p>
<form class="auth-form" onsubmit="return false;">
<div class="form-group">
<label>Email or username</label>
<input type="email" placeholder="you@example.com" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" placeholder="Enter your password" required>
</div>
<div class="form-row">
<label class="checkbox-row">
<input type="checkbox">
<span>Keep me signed in</span>
</label>
<a class="link-small">Forgot your password?</a>
</div>
<button type="submit" class="btn btn-filled auth-btn">Sign in</button>
</form>
<div class="auth-footer-text">
<p>New to Starbucks? <a href="signin.html" class="link-small">Join now</a></p>
</div>
</div>
</main>
<footer class="footer">
<p>© 2025 Starbucks Clone</p>
</footer>
<script src="script.js"></script>
</body>
</html>
